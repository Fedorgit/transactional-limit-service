spring:
  application:
    name: transactional-limit-service
  docker:
    compose:
      enabled: false
  datasource:
    url: ${DB_URL}
    password: ${DB_PASSWORD}
    username: ${DB_USERNAME}
  jpa:
    hibernate:
      ddl-auto: none
  jackson:
    property-naming-strategy: SNAKE_CASE
  config:
    import: classpath:exchange-rates.yaml

external-api:
    alphavantage:
      key: ${API_KEY_ALPHAVANTAGE}
      uri: ${API_URI_ALPHAVANTAGE}
