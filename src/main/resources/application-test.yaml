spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:library_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE
  config:
    import: classpath:exchange-rates.yaml
  threads:
    virtual:
      enabled: true

external-api:
  alphavantage:
    key: wiremock-test-key
    uri: http://localhost:9561
