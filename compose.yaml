services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-transactional_limit_db}
      POSTGRES_USER: ${DB_USERNAME:-limits}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-transactional_limit_db}
      DB_USERNAME: ${DB_USERNAME:-limits}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in your environment or .env file}
      API_KEY_ALPHAVANTAGE: ${API_KEY_ALPHAVANTAGE:?Set API_KEY_ALPHAVANTAGE in your environment or .env file}
      API_URI_ALPHAVANTAGE: ${API_URI_ALPHAVANTAGE:-https://www.alphavantage.co/query}
    ports:
      - "${APP_HOST_PORT:-8080}:8080"

volumes:
  postgres_data:
